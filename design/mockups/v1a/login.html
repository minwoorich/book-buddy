<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Buddy — 로그인</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap { max-width: 860px; margin: 0 auto; padding: 70px 24px 90px; text-align: center; }
  .logo-big { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .logo-big .logo-mark { width: 44px; height: 44px; border-radius: 10px; }
  .logo-big b { font-family: "Noto Serif KR", serif; font-size: 26px; display: block; text-align: left; }
  .logo-big span { font-size: 11px; color: var(--sub); letter-spacing: 2.6px; display: block; text-align: left; margin-top: 2px; }
  h1 { font-family: "Noto Serif KR", serif; font-size: 24px; font-weight: 600; margin: 0 0 8px; }
  .sub { color: var(--sub); font-size: 14.5px; margin-bottom: 40px; }
  .people { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .person { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 18px 12px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: border-color .12s, transform .12s; }
  .person:hover { border-color: var(--red); transform: translateY(-3px); }
  .person .avatar { width: 44px; height: 44px; font-size: 17px; }
  .person .nm { font-weight: 700; font-size: 15px; color: var(--ink); }
  .person .org { font-size: 12px; color: var(--sub); line-height: 1.5; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-big">
    <div class="logo-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M3 5c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0-3-1.5-6-1.5-9 0V5z"></path><line x1="12" y1="5" x2="12" y2="19"></line></svg>
    </div>
    <div><b>Book Buddy</b><span>VATECH LIBRARY</span></div>
  </div>
  <h1>어서 오세요</h1>
  <div class="sub">이름을 선택하면 바로 시작합니다</div>

  <div class="people">
    <a class="person" href="main.html"><span class="avatar">민</span><span class="nm">김민우</span><span class="org">바텍 · SW개발팀<br>사원</span></a>
    <a class="person" href="main.html"><span class="avatar">서</span><span class="nm">이서연</span><span class="org">바텍 · 마케팅팀<br>대리</span></a>
    <a class="person" href="main.html"><span class="avatar">지</span><span class="nm">박지훈</span><span class="org">레이언스 · 연구소<br>책임</span></a>
    <a class="person" href="main.html"><span class="avatar">은</span><span class="nm">최은지</span><span class="org">바텍 · 인사팀<br>과장</span></a>
    <a class="person" href="main.html"><span class="avatar">다</span><span class="nm">정다은</span><span class="org">바텍네트웍스 · 영업팀<br>사원</span></a>
    <a class="person" href="main.html"><span class="avatar">상</span><span class="nm">한상우</span><span class="org">바텍 · SW개발팀<br>팀장</span></a>
    <a class="person" href="main.html"><span class="avatar">유</span><span class="nm">오유진</span><span class="org">레이언스 · 품질팀<br>대리</span></a>
    <a class="person" href="main.html"><span class="avatar">태</span><span class="nm">강태호</span><span class="org">바텍 · 재무팀<br>차장</span></a>
    <a class="person" href="main.html"><span class="avatar">소</span><span class="nm">윤소라</span><span class="org">바텍네트웍스 · CS팀<br>사원</span></a>
    <a class="person" href="main.html"><span class="avatar">준</span><span class="nm">임준영</span><span class="org">바텍 · 연구소<br>수석</span></a>
    <a class="person" href="main.html"><span class="avatar">지</span><span class="nm">서지민</span><span class="org">레이언스 · 기획팀<br>대리</span></a>
    <a class="person" href="admin.html"><span class="avatar">관</span><span class="nm">도서관리자</span><span class="org">바텍 · 경영지원<br><span class="badge red">관리자</span></span></a>
  </div>
</div>
<!-- 비로그인 화면: 챗봇 버튼 없음 -->
</body>
</html>
