<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>페이지 로더 시안 — 道, 서관</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --red:#E60012; --ink:#221D15; --sub:#7A7263; --line:#E7DFD2; --line-strong:#D8CEBC; --bg:#FFFFFF; --card:#FFFFFF; --shelf-a:#C9A87E; --shelf-b:#9F7B52; }
  .dark { --red:#FF4438; --ink:#F1EBE0; --sub:#A89F8E; --line:#3A342B; --line-strong:#4A4336; --bg:#17140F; --card:#221D15; --shelf-a:#8E7452; --shelf-b:#5E4630; }
  body { margin:0; font-family:"Pretendard Variable",Pretendard,sans-serif; background:#F3EFE7; color:#221D15; padding:40px; }
  h1 { font-size:20px; margin:0 0 6px; } p.lead { color:#7A7263; margin:0 0 28px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; max-width:1000px; }
  .frame { position:relative; height:300px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); overflow:hidden; }
  .frame .fake { padding:20px; opacity:.35; }
  .fake .bar { height:10px; background:var(--line); border-radius:3px; margin:10px 0; }
  .cap { font-size:12.5px; color:#7A7263; margin-top:8px; }
  .cap b { color:#221D15; }

  /* ── 공통 오버레이 ── */
  .veil { position:absolute; inset:0; display:grid; place-items:center; background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(2px); }
  .box { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .label { font-size:12.5px; letter-spacing:2.5px; color:var(--sub); }

  /* ── A. 책등 3권 ── */
  .spines { display:flex; align-items:flex-end; gap:5px; height:34px; padding-bottom:4px; border-bottom:3px solid; border-image:linear-gradient(180deg,var(--shelf-a),var(--shelf-b)) 1; width:56px; justify-content:center; }
  .spines i { display:block; width:9px; height:24px; border-radius:1.5px; background:var(--line-strong); animation:rise 1.4s cubic-bezier(.45,0,.2,1) infinite; }
  .spines i:nth-child(2) { height:28px; background:var(--red); animation-delay:.18s; }
  .spines i:nth-child(3) { height:22px; animation-delay:.36s; }
  @keyframes rise { 0%,70%,100% { transform:translateY(0); } 25% { transform:translateY(-7px); } }

  /* ── B. 페이지 넘김 ── */
  .book { position:relative; width:44px; height:30px; perspective:160px; }
  .book::before, .book::after { content:""; position:absolute; top:0; bottom:0; width:50%; border:1.5px solid var(--line-strong); background:var(--card); }
  .book::before { left:0; border-radius:3px 0 0 3px; border-right:0; }
  .book::after { right:0; border-radius:0 3px 3px 0; border-left:1.5px solid var(--red); }
  .book .page { position:absolute; top:0; bottom:0; right:0; width:50%; background:var(--card); border:1.5px solid var(--line-strong); border-left:0; border-radius:0 3px 3px 0; transform-origin:left center; animation:flip 1.5s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes flip { 0% { transform:rotateY(0); } 60%,100% { transform:rotateY(-180deg); } }
</style>
</head>
<body>
<h1>페이지 이동 로더 시안</h1>
<p class="lead">두 후보를 라이트·다크에서 비교. 레드는 한 요소에만. 150ms 이상 걸리는 이동에서만 등장.</p>
<div class="grid">
  <div>
    <div class="frame"><div class="fake"><div class="bar" style="width:40%"></div><div class="bar"></div><div class="bar" style="width:80%"></div></div>
      <div class="veil"><div class="box"><div class="spines"><i></i><i></i><i></i></div><div class="label">서가로 이동 중</div></div></div></div>
    <div class="cap"><b>A. 책등 3권</b> — 선반 위 책 세 권이 차례로 살짝 떠오름. 가운데만 레드.</div>
  </div>
  <div>
    <div class="frame dark"><div class="fake"><div class="bar" style="width:40%"></div><div class="bar"></div><div class="bar" style="width:80%"></div></div>
      <div class="veil"><div class="box"><div class="spines"><i></i><i></i><i></i></div><div class="label">서가로 이동 중</div></div></div></div>
    <div class="cap"><b>A. 다크</b></div>
  </div>
  <div>
    <div class="frame"><div class="fake"><div class="bar" style="width:40%"></div><div class="bar"></div><div class="bar" style="width:80%"></div></div>
      <div class="veil"><div class="box"><div class="book"><div class="page"></div></div><div class="label">서가로 이동 중</div></div></div></div>
    <div class="cap"><b>B. 페이지 넘김</b> — 펼친 책의 오른쪽 장이 넘어감.</div>
  </div>
  <div>
    <div class="frame dark"><div class="fake"><div class="bar" style="width:40%"></div><div class="bar"></div><div class="bar" style="width:80%"></div></div>
      <div class="veil"><div class="box"><div class="book"><div class="page"></div></div><div class="label">서가로 이동 중</div></div></div></div>
    <div class="cap"><b>B. 다크</b></div>
  </div>
</div>
</body>
</html>
