<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Gaegu', 'Malgun Gothic', sans-serif; color: #2f2a22; }
    a { color: #b45309; } a:hover { color: #92400e; }
    .ph {
      background:
        linear-gradient(to top right, transparent calc(50% - 1px), #b8b0a4 calc(50% - 1px), #b8b0a4 calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(to bottom right, transparent calc(50% - 1px), #b8b0a4 calc(50% - 1px), #b8b0a4 calc(50% + 1px), transparent calc(50% + 1px)),
        #efeae2;
      border: 1.5px solid #9c9484;
      box-sizing: border-box;
    }
    .bar { background: #ddd6ca; border-radius: 4px; height: 10px; }
  </style>
</helmet>
<div style="width: 880px; height: 640px; box-sizing: border-box; background: #faf7f0; padding: 18px 32px 24px; display: flex; flex-direction: column; gap: 16px; position: relative;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a4234" stroke-width="2" stroke-linejoin="round"><path d="M3 5c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0-3-1.5-6-1.5-9 0V5z"></path><line x1="12" y1="5" x2="12" y2="19"></line></svg>
      <span style="font-size: 24px; font-weight: 700;">Book Buddy</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; border: 1.5px solid #9c9484; border-radius: 999px; padding: 3px 12px 3px 4px;">
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #efeae2; border: 1.5px solid #9c9484; display: flex; align-items: center; justify-content: center; font-size: 14px; box-sizing: border-box;">민</span>
      <span style="font-size: 16px;">김민우 님</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px;">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700;">오늘은 어떤 책을 읽어볼까요?</h1>
    <div style="width: 540px; box-sizing: border-box; background: #ffffff; border: 2px solid #4a4234; border-radius: 999px; padding: 10px 18px; display: flex; align-items: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4234" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <span style="color: #a89f8f; font-size: 17px;">예: 프로젝트 관리 입문서 있어?</span>
    </div>
  </div>
  <div style="background: #fbf0dc; border: 1.5px dashed #b45309; border-radius: 14px; padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"></path><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"></path></svg>
      <span style="font-weight: 700; color: #92400e; font-size: 18px;">AI 검색 답변</span>
    </div>
    <div class="bar" style="width: 92%;"></div>
    <div class="bar" style="width: 68%;"></div>
    <div style="display: flex; gap: 14px; margin-top: 2px;">
      <div style="display: flex; flex-direction: column; gap: 4px; width: 58px;">
        <div class="ph" style="width: 58px; height: 76px; border-radius: 3px;"></div>
        <div class="bar" style="width: 100%; height: 8px;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; width: 58px;">
        <div class="ph" style="width: 58px; height: 76px; border-radius: 3px;"></div>
        <div class="bar" style="width: 100%; height: 8px;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; width: 58px;">
        <div class="ph" style="width: 58px; height: 76px; border-radius: 3px;"></div>
        <div class="bar" style="width: 100%; height: 8px;"></div>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-size: 20px; font-weight: 700;">이달의 서가</span>
      <a href="#" style="font-size: 15px;">전체 보기</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="ph" style="height: 128px; border-radius: 4px;"></div>
        <div class="bar" style="width: 90%;"></div>
        <div class="bar" style="width: 55%; height: 8px;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="ph" style="height: 128px; border-radius: 4px;"></div>
        <div class="bar" style="width: 85%;"></div>
        <div class="bar" style="width: 60%; height: 8px;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="ph" style="height: 128px; border-radius: 4px;"></div>
        <div class="bar" style="width: 95%;"></div>
        <div class="bar" style="width: 50%; height: 8px;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="ph" style="height: 128px; border-radius: 4px;"></div>
        <div class="bar" style="width: 80%;"></div>
        <div class="bar" style="width: 65%; height: 8px;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="ph" style="height: 128px; border-radius: 4px;"></div>
        <div class="bar" style="width: 88%;"></div>
        <div class="bar" style="width: 58%; height: 8px;"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; right: 24px; bottom: 24px; width: 54px; height: 54px; border-radius: 50%; background: #ffffff; border: 2px solid #4a4234; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v12H10l-6 5V4z"></path></svg>
  </div>
</div>
</x-dc>
</body>
</html>
